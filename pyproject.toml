[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llrflibs-rl"
version = "0.2.0"
description = "Reinforcement-learning environments, agents and evaluation for LLRF (low-level RF) control of particle-accelerator RF cavities."
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10"
authors = [
    { name = "Ming Liu", email = "mliu1018@ustc.edu.cn" },
]
maintainers = [
    { name = "Ming Liu", email = "mliu1018@ustc.edu.cn" },
]
keywords = [
    "accelerator", "LLRF", "cavity", "reinforcement-learning", "gymnasium",
    "particle-accelerator", "RF-control", "superconducting-cavity",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "llrflibs>=1.0.2",
    "gymnasium>=0.29",
    "stable-baselines3>=2.0",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Development / test tooling.
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
]
# TensorBoard logging for stable-baselines3 training runs.
tensorboard = [
    "tensorboard>=2.14",
]

[project.urls]
Homepage = "https://github.com/iuming/LLRFLibs_RL"
Repository = "https://github.com/iuming/LLRFLibs_RL"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
