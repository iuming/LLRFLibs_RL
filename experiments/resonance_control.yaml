# Resonance control — slow tuner/piezo compensation of cavity detuning (Level L1).
experiment:
  env: FrequencyControl-v0
  algorithm: ppo
  timesteps: 2000
  seed: 0
  runs_dir: runs

notes: >
  The RF drive is constant; the RL policy commands a first-order tuner
  actuator against sinusoidal microphonics plus Lorentz-force mechanical
  modes.  The algorithm comparison showed on-policy PPO outperforms SAC/TD3 at
  the recommended budget on this environment.
