# Vector-sum with per-cavity slow tuners (Level L3+) — experiment spec.
experiment:
  env: VectorSumTuner-v0
  algorithm: sac
  timesteps: 20000
  seed: 0
  baseline: zero
  runs_dir: runs

notes: >
  A shared RF source plus one first-order tuner actuator per cavity.  The
  action is [I/Q residual, tuner_1, ..., tuner_n]; the observation carries the
  per-cavity tuner states and signed detunings.  The default on-policy PPO
  collapses into drive saturation on long budgets, so the preset uses a
  stable off-policy SAC (train_freq=gradient_steps=64, batch 256) verified by
  experiments/vector_sum_tuner_study.py.
